name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AgriShield Backend
        run: |
          echo "Pinging backend to keep it awake..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://agrishield-131-backend-testing.onrender.com/)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is alive!"
          else
            echo "⚠️ Backend returned status $STATUS"
          fi
